<div class="d-flex flex-column align-items-center px-4">
    <div class="card shadow p-4" style="width: 100%; max-width: 480px;">
        <h2 class="fancy-subtitle mb-0">Login</h2>
        <hr class="gradient-divider">

        <form class="d-flex flex-column gap-3 py-2" method="post">
            {% csrf_token %}

            {{ form.as_p }}

                <!-- {{ form.username }}

                {{ form.password1 }}

                {{ form.password2 }} -->

            <button class="btn btn-outline-success rounded-pill" type="submit">Login</button>

            <small class="text-muted">Don't have an account? <a class="text-decoration-none" href="{% url 'register' %}">Register here</a></small>

            <small class="text-muted">Forgot your password? <a class="text-decoration-none" href="{% url 'register' %}">Reset your password here</a></small>

            
        </form>
    </div>
</div>
