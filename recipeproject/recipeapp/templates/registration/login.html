{% extends "base.html" %}
{% load static %}
{% block title %}Login{% endblock %}
{% block content %}

<div class="d-flex flex-column align-items-center px-4">

    <!-- Login Card -->
    <div class="card shadow p-4" style="width: 100%; max-width: 480px;">
        <h2 class="fancy-subtitle mb-0">Login</h2>
        <hr class="gradient-divider">

        <!-- Login Form -->
        <form class="d-flex flex-column gap-3 mt-3" method="post" action="{% url 'login' %}">
            {% csrf_token %}

            <!-- Input Fields -->
            <input type="text" name="username" class="form-control" placeholder="Enter username" required>
            <input type="password" name="password" class="form-control" placeholder="Enter password" required>

            <!-- Doesn't Work -->
            <!-- Error Message -->
            {% if error %}
                <div class="text-danger">
                    {{ error }}
                </div> 
            {% endif %}
            
            <!-- Submit Button & Additional Links -->
            <button class="btn btn-outline-success rounded-pill mt-3" type="submit">Login</button>

            <div class="d-flex flex-column gap-2">
                <small class="text-muted">Don't have an account? <a class="text-decoration-none"
                        href="{% url 'register' %}">Register here</a></small>
        
                <!-- Missing Link Destination -->
                <small class="text-muted">Forgot your password? <a class="text-decoration-none" href="/">Reset password
                        here</a></small>
            </div>
        </form>
    </div>
</div>

{% endblock %}
