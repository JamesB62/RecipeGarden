{% extends "base.html" %}
{% load static %}
{% block title %}Register{% endblock %}
{% block content %}

<div class="d-flex flex-column align-items-center px-4">

    <!-- Register Card -->
    <div class="card shadow p-4" style="width: 100%; max-width: 480px;">
        <h2 class="fancy-subtitle mb-0">Register</h2>
        <hr class="gradient-divider">

        <!-- Register Form -->
        <form class="d-flex flex-column gap-3 mt-3" method="post">

            <!-- Input Fields -->
            {% csrf_token %}
            {{ form.username }}
            {{ form.email }}
            {{ form.password1 }}
            {{ form.password2 }}

            <!-- Submit Button & Additional Links -->
            <button class="btn btn-outline-success rounded-pill mt-3" type="submit">Register</button>
            <small class="text-muted">Already have an account? <a class="text-decoration-none"
                    href="{% url 'login' %}">Login here</a></small>
        </form>
    </div>
</div>

{% endblock %}
