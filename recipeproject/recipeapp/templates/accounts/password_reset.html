{% extends "base.html" %}
{% load static %}
{% block title %}Reset Password{% endblock %}
{% block content %}

<!-- Page Content Block -->
<div class="w-100">

    <!-- Password Reset Block -->
    <div class="d-flex flex-column align-items-center mx-4">

        <!-- Password Reset Card -->
        <div class="card shadow p-4 w-100" style="max-width: 500px;">
            <h2 class="fancy-subtitle mb-2">Reset Your Password</h2>
            <form method="post" novalidate>
                {% csrf_token %}
                
                <!-- Email Address -->
                <div class="mb-3">
                    <label class="form-label mb-0">Email Address</label>
                    <input type="email" name="email" id="id_email" class="form-control" required value="{{ form.email.value|default_if_none:'' }}">
                    {% if form.errors %}
                        {% for field in form %}
                            {% for error in field.errors %}
                                <div class="text-danger small mb-0">{{ error }}</div>
                            {% endfor %}
                        {% endfor %}
                    {% endif %}
                </div>

                <!-- Closing Button -->
                <div class="d-flex flex-column gap-2 mt-3">
                    <div>
                        <button type="submit" class="btn btn-outline-success rounded-pill">Send Reset Email</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>

{% endblock %}
