<h1>All Recipes</h1>

{% for recipe in recipes %}
    <div>
        <h2>{{ recipe.title }}</h2>
        <p>{{ recipe.description }}</p>
        <p>Total time: {{ recipe.total_time }} minutes | Servings: {{ recipe.servings }}</p>
        {% if recipe.image %}
            <img src="{{ recipe.image.url }}" width="300" alt="{{ recipe.title }}">
        {% endif %}
    </div>
{% endfor %}
